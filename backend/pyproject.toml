[project]
name = "lattice"
version = "0.1.0"
description = "Lattice: a governed knowledge store for AI agents"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20,<2",
    "fastapi>=0.143,<1",
    "mcp>=2.3,<3",
    "psycopg[binary]>=3.2,<4",
    "pwdlib[argon2]>=0.2",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["property: Hypothesis property tests against PostgreSQL (slow)"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "hypothesis>=6.100",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "testcontainers[postgres]>=4",
]
