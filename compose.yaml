services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lattice
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lattice"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      LATTICE_DATABASE_URL: postgresql+psycopg://lattice_app:lattice_app_dev@db:5432/lattice
      LATTICE_MIGRATION_DATABASE_URL: postgresql+psycopg://lattice_owner:lattice_owner_dev@db:5432/lattice
      LATTICE_SECRET_PEPPER: ${LATTICE_SECRET_PEPPER:-local-demo-pepper-change-me}
      LATTICE_PUBLIC_ORIGIN: http://localhost:8000
      # Local HTTP only; remove behind TLS (KTD13).
      LATTICE_INSECURE_DEV_COOKIES: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
